# Builds the site and publishes it with GitLab Pages on every push to the default branch.
# Requires CI/CD variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY
# (Settings → CI/CD → Variables).

pages:
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    # GitLab Pages serves the "public" folder; replace Vite's static source folder with the build.
    - rm -rf public && mv dist public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
